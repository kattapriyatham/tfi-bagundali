name: tfi_bagundaali
description: "TFI Bagundaali - a Telugu cinema party card game."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^2.4.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/deck.json
    - assets/title-logo.png
    - assets/fan-ticket.png
    - assets/symbols/
