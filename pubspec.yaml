name: tfi_bagundaali
description: "TFI Bagundaali - a Telugu cinema party card game."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^2.4.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_mobile_ads: ^9.0.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_database: ^12.5.0
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  very_good_analysis: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#C63B2B"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/deck.json
    - assets/title-logo.png
    - assets/fan-ticket.png
    - assets/game-bg.png
    - assets/symbols/
